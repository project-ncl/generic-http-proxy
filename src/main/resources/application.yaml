quarkus:
  http:
    port: 8080
    read-timeout: 30s
  log:
    level: INFO
    category:
      "org.jboss.pnc.proxy":
        level: DEBUG
      "org.commonjava.indy.model":
        level: ERROR
  otel:
    enabled: true
    exporter:
      otlp:
        traces:
        # This is for sending to something like opentelemetry-collector
        # endpoint: http://localhost:4317

        # This is for sending to Honeycomb
        # endpoint: "https://api.honeycomb.io:443"
        #    headers:
        #      - "X-honeycomb-team=<write-key>"
        #      - "X-honeycomb-dataset=test"
  oidc-client:
    auth-server-url: "keycloak_server_url/realms/pncredhat"
    client-id: your_client_id
    credentials:
      secret: your_secret
  container-image:
    registry: quay.io
    group: rh-newcastle-devel
    name: generic-http-proxy
    additional-tags: latest

proxy:
  port: 8082
  realm: httprox
  secured: true
  worker:
    io:
      threads: 10
    task:
      threads: 10
    connection:
      high-water: 50

service_proxy:
  read-timeout: 30m
  retry:
    count: 3
    interval: 3000
  services:
    - host: localhost
      ssl: false
      port: 8080
      path-pattern: /api/.+

executor:
  mitm-transfers:
    max-async: 100
    max-queued: 50

## [MITM]
## CA key supports both PEM (.pem, .key) and DER (.der) formats (auto-detected)
## CA cert supports both PEM (.pem, .crt) and DER formats (auto-detected)
MITM:
  enabled: true
  ca:
    key: /tmp/ssl/ca.key
    cert: /tmp/ssl/ca.crt
  dn:
    template: CN=<host>, O=Test Org
  so:
    timeout:
      minutes: 30

tracking:
  type: SUFFIX

## [storage] - preferred is 'base64url' (for backward compatible, default is 'hashed'). User needs to update dep >= org.commonjava.indy.service:indy-model-core-java:1.5
storage:
  path:
    style: hashed

## [Artifactory]
artifactory:
  url: ${ARTIFACTORY_URL:http://localhost:8081/artifactory}
  access-token: ${ARTIFACTORY_ACCESS_TOKEN:abcd}
  connection-timeout: 30
  socket-timeout: 60
  project-key: ${PROJECT_KEY:NCL}
  # Static tracking credentials (used when tracking.type=STATIC)
  static-tracking-user: ${ARTIFACTORY_STATIC_USER:}
  static-tracking-password: ${ARTIFACTORY_STATIC_PASSWORD:}

## [rest client - legacy Indy, to be removed]
repo-service-api/mp-rest/uri: http://localhost:8080

## [auth]
auth:
  enabled: false
  realm: keycloak.realm
  public-key: keycloak.realmPublicKey
  keycloak-json: keycloak/keycloak.json
  keycloak-ui-json: keycloak/keycloak-ui.json
  security-bindings-json: keycloak/security-bindings.json
  url: keycloak.url
  server:
    credential:
      secret: keycloak.serverCredentialSecret
    resource: indy
  ui:
    resource: indy-ui
